name: Build & Deploy (Flutter Web)

on:
  push:
    branches: [ main ]   # anpassen, falls du anders deployen willst
  workflow_dispatch:

permissions:
  contents: write   # wichtig für Push auf gh-pages

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web (GitHub Pages unter /lucid/)
        run: flutter build web --release --base-href /lucid/ --pwa-strategy none

      # Optional: Service Worker aus dem Build entfernen, falls der noch auftaucht
      - name: Remove service worker (optional but safe)
        run: |
          rm -f build/web/flutter_service_worker.js || true
          rm -f build/web/manifest.json || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          # Verhindert "expected sha" Konflikte & Branch-Schutz-Probleme:
          force_orphan: true
          # Falls du ein CNAME brauchst, hier setzen:
          # cname: example.com
