name: Build & Deploy (Flutter Web)

on:
  push:
    branches: [ main ]         # ggf. anpassen
  workflow_dispatch:

permissions:
  contents: write              # nötig fürs Pushen

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true     # verhindert parallele Deploys

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'    # nur von main deployen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # vollständige Historie vermeidet Push-Konflikte

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Web (GitHub Pages unter /lucid/)
        run: flutter build web --release --base-href /lucid/ --pwa-strategy none

      # Optional: SW/Manifest entfernen, um harte Caches zu vermeiden
      - name: Remove service worker & manifest (optional)
        run: |
          rm -f build/web/flutter_service_worker.js || true
          rm -f build/web/manifest.json || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          force_orphan: true               # jedes Mal frischer Commit ⇒ keine "expected sha"-Fehler
          # keep_files: false              # Standard: alles überschreiben
