name: lucid_dreams_aaa
description: Lucid – Klarträumen lernen. Geführtes Programm, Nachtmodus, Traumtagebuch und geprüftes Wissen. Alle Daten bleiben auf dem Gerät.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^5.2.1
  just_audio: ^0.9.39
  flutter_markdown: ^0.6.18
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.3
  shared_preferences: ^2.5.3
  share_plus: ^10.0.0
  http: ^1.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: false

  assets:
    # Wortmarke und Bühnenbilder
    - assets/logo/logo-text.svg
    - assets/logo/logo-signet.svg
    - assets/slider/violetter-sonnenuntergang-ruhiger-see.webp
    - assets/slider/sternhimmel-ueber-einsamen-berg-rosa-horizont.webp
    - assets/slider/polarleuchten-ueber-bergkamm-pastell.webp
    - assets/slider/sternennacht-silhouette-gebirgskette.webp
    - assets/slider/mondsichel-ueber-bergkette-blaue-stunde.webp
    - assets/slider/lichttor-in-wolken-goldene-stunde.webp

    # Töne für Wecksignal, Klangsignale und Reality-Check-Erinnerungen
    - assets/audio/cues/
    - assets/images/cue_categories/

    # Entspannung
    - assets/audio/affirmations/
    - assets/meditations/manifest.json
    - assets/meditations/tracks/
    - assets/meditations/covers/
    - assets/traumreisen/manifest.json
    - assets/traumreisen/images/
    - assets/traumreisen/audio/

    # Wissen und Studien-Feed
    - assets/wissen/
    - assets/feed/

  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
